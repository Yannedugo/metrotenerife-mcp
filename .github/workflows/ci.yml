name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar
        run: pip install -e ".[dev,mcp]"

      - name: Ruff
        run: |
          ruff check src tests custom_components scripts
          ruff format --check src tests custom_components scripts

      - name: Copia vendorizada
        run: python scripts/sync_vendor.py --check

      - name: Pytest
        run: pytest -v

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Comprobaciones rápidas de estructura, sin red, antes de la action oficial.
      - name: Validar estructura HACS
        run: python3 scripts/validate_hacs.py

      - name: HACS Action
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
